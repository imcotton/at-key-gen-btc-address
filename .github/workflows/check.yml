name: Check



on: push



permissions:
  contents: read
  id-token: write



jobs:

  test-JSR:

    runs-on: ubuntu-slim
    timeout-minutes: 3

    steps:

      - name: Setup repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2

      - name: Run linter
        run: deno lint

      - name: Run tests
        run: deno task spec --coverage --quiet --parallel

      - name: Run publish --dry-run
        run: deno publish --dry-run

      - name: Run codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: coverage/lcov.info
          use_oidc: true



  test-npm:

    runs-on: ubuntu-slim
    timeout-minutes: 3

    steps:

      - name: Setup repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: v24

      - name: Move package.json
        run: cp tmp-package.json package.json

      - name: Install
        run: npm install --no-{fund,package-lock}

      - name: Tests
        run: node --test --experimental-test-coverage

      - name: Build
        run: npx tsc ./src/*.ts
                     --outDir ./dist
                     --types  node
                     --lib    es2023
                     --target es2023
                     --module preserve
                     --strict
                     --isolatedModules
                     --erasableSyntaxOnly
                     --rewriteRelativeImportExtensions

      - name: Publish --dry-run
        run: npm publish --access=public --tag=next --dry-run
